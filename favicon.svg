<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
    <style>
        /* По умолчанию (светлая тема) - черный */
        text { fill: #000000; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; font-weight: 900; font-size: 50px; }
        
        /* Темная тема - белый */
        @media (prefers-color-scheme: dark) {
            text { fill: #ffffff; }
        }
    </style>
    
    <!-- 
      Мы используем textLength и lengthAdjust, 
      чтобы буквы растянулись ровно на всю ширину иконки (от края до края).
    -->
    <text x="50%" y="55%" text-anchor="middle" dominant-baseline="middle" 
          textLength="90" lengthAdjust="spacingAndGlyphs">GLX</text>
</svg>
